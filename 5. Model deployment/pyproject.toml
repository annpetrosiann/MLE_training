[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "iris_deploy"
version = "0.1"
description = "Iris ML deployment pipeline with training, batch, and REST API"
authors = [
    { name="Anahit Petrosyan", email="anahit_petrosian@epam.com" }
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "flask",
    "scikit-learn",
    "pandas",
    "numpy"
]

[project.scripts]
train-iris = "iris_deploy.training:main"
predict-batch = "iris_deploy.batch_runner:main"
run-server = "iris_deploy.rest_server:main"

[tool.setuptools]
packages = ["iris_deploy"]
